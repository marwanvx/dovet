name: diag-windows
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: bench 5,000 files on D (runner temp)
        shell: pwsh
        run: bun scripts/bench-snapshots.ts 5000 "$env:RUNNER_TEMP"
      - name: bench 5,000 files on C (os temp)
        shell: pwsh
        run: bun scripts/bench-snapshots.ts 5000 "$env:TEMP"
      - name: bench 20,000 files on D (runner temp)
        shell: pwsh
        timeout-minutes: 15
        run: bun scripts/bench-snapshots.ts 20000 "$env:RUNNER_TEMP"
