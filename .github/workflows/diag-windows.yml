name: diag-windows
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Machine
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusEnabled,AMServiceEnabled | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free,Root
          "TEMP=$env:TEMP"; "RUNNER_TEMP=$env:RUNNER_TEMP"; "WORKSPACE=$env:GITHUB_WORKSPACE"
          (Get-CimInstance Win32_Processor).Name; "cores: $env:NUMBER_OF_PROCESSORS"
          git --version
      - name: C temp, Defender on
        run: bun scripts/diag-fs.ts "$env:TEMP" 3000
        shell: pwsh
      - name: D runner temp, Defender on
        run: bun scripts/diag-fs.ts "$env:RUNNER_TEMP" 3000
        shell: pwsh
      - name: Defender excluded (C temp and D runner temp)
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP, $env:RUNNER_TEMP
          Add-MpPreference -ExclusionProcess "bun.exe","git.exe"
          Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess | Format-List
          bun scripts/diag-fs.ts "$env:TEMP" 3000
          bun scripts/diag-fs.ts "$env:RUNNER_TEMP" 3000
