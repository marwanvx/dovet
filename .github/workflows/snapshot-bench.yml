# SPIKE-22: times git tree snapshots on a 100,000-file repository on all three OSes (docs/plan/open-questions.md).
# Runs when the snapshot code or the benchmark changes, or by hand.
name: snapshot-bench

on:
  pull_request:
    paths:
      - "src/store/snapshots/**"
      - "scripts/bench-snapshots.ts"
      - ".github/workflows/snapshot-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/bench-snapshots.ts 100000
