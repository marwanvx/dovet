# SPIKE-22: times git tree snapshots on a large repository on all three OSes (docs/plan/open-questions.md).
# Manual only (Actions > snapshot-bench > Run workflow): it is a measurement, not a gate, and a pull_request path filter
# would re-run it on every push of a PR that ever touched the snapshot code.
name: snapshot-bench

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Number of files in the benchmark repository"
        default: "20000"
        required: true

permissions:
  contents: read

# A newer run of the same branch makes an older one pointless.
concurrency:
  group: snapshot-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The repository goes on the runner's temp drive (D: on Windows, about 4 times faster than C:).
      - run: bun scripts/bench-snapshots.ts "${{ inputs.files }}" "${{ runner.temp }}"
