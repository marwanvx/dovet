# SPIKE-22: times git tree snapshots on a 100,000-file repository on all three OSes (docs/plan/open-questions.md).
# Runs (20,000 files) when the snapshot code or the benchmark changes; the 100,000-file run only by hand.
name: snapshot-bench

on:
  pull_request:
    paths:
      - "src/store/snapshots/**"
      - "scripts/bench-snapshots.ts"
      - ".github/workflows/snapshot-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run pointless.
concurrency:
  group: snapshot-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: 20,000 files
        timeout-minutes: 20
        run: bun scripts/bench-snapshots.ts 20000 "${{ runner.temp }}"
      # The big run takes up to 45 minutes on Windows, so it only runs when started by hand (Actions > snapshot-bench > Run workflow).
      - name: 100,000 files
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        continue-on-error: true
        run: bun scripts/bench-snapshots.ts 100000 "${{ runner.temp }}"
