# SPIKE-42 first look (M0-08): does @microsoft/mxc-sdk run a command from a Bun-compiled executable on Windows 11?
# A record, not a gate: the results are in each job's summary and written under SPIKE-42 in open questions.
# The SDK is installed for this job only (`--no-save`); it is not a Dovet dependency yet.
name: mxc-spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - test/platform/mxc/**
      - .github/workflows/mxc-spike.yml

permissions:
  contents: read

concurrency:
  group: mxc-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: Windows 11 24H2 (the platform MXC targets); windows-2025: Server 2025, same 26100 build line.
        os: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun add --no-save @microsoft/mxc-sdk@1.0.0
      - run: bun test/platform/mxc/run-spike.ts
