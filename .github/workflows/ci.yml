# Every PR and every push to main: `bun run check` on Linux, macOS and Windows (docs/specs/architecture.md).
# Actions are pinned by commit SHA; dependabot keeps the pins current.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Linux sandbox needs bubblewrap and socat, and user namespaces allowed (AppArmor on Ubuntu 24.04)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run check
      - name: all eight release archives build
        if: matrix.os == 'ubuntu-latest'
        run: bun run release
      # SPIKE-4: the owner tries pi-tui on real terminals with this binary (checklist in the M0-06 PR). A single
      # uncompressed upload keeps the executable bit (a .tar.gz on macOS and Linux; zipped uploads lose it).
      - name: build tui-demo for the terminal checklist
        id: tui-demo
        shell: bash
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          mkdir -p dist/tui-demo
          if [ "$os" = windows ]; then
            file="dist/tui-demo/tui-demo-$os-$arch.exe"
            bun scripts/tui-demo.ts --build "$file"
          else
            bun scripts/tui-demo.ts --build dist/tui-demo/tui-demo
            file="dist/tui-demo/tui-demo-$os-$arch.tar.gz"
            tar -C dist/tui-demo -czf "$file" tui-demo
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.tui-demo.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: research-cache/ is never committed
        shell: bash
        run: test -z "$(git ls-files research-cache)"
