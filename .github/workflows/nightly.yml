# Nightly suites (docs/specs/testing.md "Test layers"): the free NVIDIA smoke tests and the long bash differential.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same branch makes an older one pointless.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-nvidia:
    name: live nvidia smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: live nvidia smoke (skips without a key or a working model)
        run: bun test --check test/integration/nvidia-live.test.ts
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DOVET_LIVE: "1"

  # A new advisory against an unchanged lockfile shows up here before the next PR.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun run audit

  bash-differential:
    name: shell analysis agrees with bash (100,000 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The seed is in the test's name, so a failure reproduces with DOVET_DIFF_SEED set to it.
      - run: bun test test/adversarial/bash-differential.test.ts
        env:
          DOVET_DIFF_CASES: "100000"
          DOVET_DIFF_SEED: ${{ github.run_id }}
