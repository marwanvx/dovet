name: tmp-win-diag
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - shell: bash
        continue-on-error: true
        run: |
          later="isn't HTTP|never end|bad Content-Length|isn't hexadecimal"
          for first in "short Content-Length" "cut off mid-chunk"; do
            timeout 40 bun test src/tools/web-http1.test.ts -t "$first|$later" > out.txt 2>&1 && code=0 || code=$?
            echo "=== $first + later: exit $code; $(grep -cE '^\(pass\)' out.txt) passed; $(grep -c Segmentation out.txt) segfault"
            for l in "isn't HTTP" "never end" "bad Content-Length" "isn't hexadecimal"; do
              timeout 40 bun test src/tools/web-http1.test.ts -t "$first|$l" > out.txt 2>&1 && code=0 || code=$?
              echo "=== $first + $l: exit $code; $(grep -cE '^\(pass\)' out.txt) passed; $(grep -c Segmentation out.txt) segfault"
            done
          done
