name: tmp-win-diag
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - shell: bash
        continue-on-error: true
        run: |
          names=("the request names the host" "Content-Length body split" "chunked body" "skips a 1xx" "gzip body" "redirect without a body" "a 304" "ends before the body" "malformed replies")
          for k in 2 3 4 5 6 7 8 9; do
            pat=$(IFS='|'; echo "${names[*]:0:$k}")
            bun test src/tools/web-http1.test.ts -t "$pat" > out.txt 2>&1; code=$?
            echo "=== first $k tests: exit $code: $(grep -cE '^\(pass\)' out.txt) passed lines; $(grep -c 'Segmentation' out.txt) segfault"
          done
          for skip in 0 1 2 3 4 5 6 7 8; do
            pat=$(IFS='|'; arr=(); for j in 0 1 2 3 4 5 6 7 8; do [ $j -ne $skip ] && arr+=("${names[$j]}"); done; echo "${arr[*]}" | sed 's/ \([A-Za-z0-9]\)/ \1/g' >/dev/null; IFS='|'; echo "${arr[*]}")
            bun test src/tools/web-http1.test.ts -t "$pat" > out.txt 2>&1; code=$?
            echo "=== all but #$skip: exit $code; $(grep -c 'Segmentation' out.txt) segfault"
          done
