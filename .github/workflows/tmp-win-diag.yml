name: tmp-win-diag
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - shell: bash
        continue-on-error: true
        run: |
          for n in 1 2; do
            timeout 60 bun test src/tools/web-http1.test.ts > out.txt 2>&1 && code=0 || code=$?
            echo "=== whole file run $n: exit $code; $(grep -cE '^\(pass\)' out.txt) passed; $(grep -c Segmentation out.txt) segfault"
          done
          timeout 120 bun test src/tools/webfetch.test.ts > out.txt 2>&1 && code=0 || code=$?
          echo "=== webfetch.test.ts: exit $code; $(grep -cE '^\(pass\)' out.txt) passed; $(grep -c Segmentation out.txt) segfault"
