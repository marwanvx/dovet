name: tmp-win-diag
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - shell: bash
        continue-on-error: true
        run: |
          for t in "the request names the host" "Content-Length body split" "chunked body" "until the server closes" "gzip body" "redirect without a body" "304" "ends before the body" "malformed replies"; do
            echo "=== $t"
            bun test src/tools/web-http1.test.ts -t "$t" 2>&1 | grep -E "^\((pass|fail)\)|panic|Segmentation|^ *[0-9]+ (pass|fail)" || echo "NO RESULT (crash?)"
          done
